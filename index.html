<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>株式会社アメックス｜採用情報</title>

  <style>
    /* =========================
       基本設定
    ========================= */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --green: #007a36;
      --green-dark: #005b29;
      --black: #111111;
      --gray: #f4f7f5;
      --border: rgba(0, 122, 54, 0.14);
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      width: 100%;
      background: #ffffff;
      color: var(--black);
      font-family:
        "Noto Sans JP",
        "Yu Gothic",
        "Hiragino Kaku Gothic ProN",
        Meiryo,
        sans-serif;
      overflow-x: hidden;
    }

    img {
      display: block;
      max-width: 100%;
    }

    /* =========================
       ページ全体
    ========================= */
    .page {
      width: 100%;
      overflow: hidden;
    }

    /* =========================
       TOP画像
    ========================= */
    .hero {
      width: 100%;
      background: #ffffff;
    }

    .hero-image {
      width: 100%;
      height: auto;
      object-fit: cover;
    }

    /* =========================
       年間休日などのポイント
    ========================= */
    .benefits {
      position: relative;
      padding: 55px 5vw 90px;
      background:
        radial-gradient(
          circle at top center,
          rgba(0, 122, 54, 0.06),
          transparent 38%
        ),
        linear-gradient(
          180deg,
          #ffffff 0%,
          #f5f8f6 100%
        );
    }

    .benefits-inner {
      width: min(1320px, 100%);
      margin: 0 auto;
    }

    .benefits-title-wrap {
      margin-bottom: 35px;
      text-align: center;
    }

    .benefits-subtitle {
      margin-bottom: 10px;
      color: var(--green);
      font-size: 14px;
      font-weight: 800;
      letter-spacing: 0.18em;
    }

    .benefits-title {
      font-size: clamp(25px, 3vw, 42px);
      line-height: 1.4;
      font-weight: 900;
      letter-spacing: 0.04em;
    }

    .benefits-title span {
      color: var(--green);
    }

    .benefits-description {
      margin-top: 14px;
      color: #555;
      font-size: clamp(14px, 1.3vw, 17px);
      line-height: 1.9;
    }

    /* =========================
       カード配置
    ========================= */
    .benefits-grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 20px;
    }

    .benefit-card {
      position: relative;
      min-height: 180px;
      padding: 28px 20px;
      border: 1px solid var(--border);
      border-radius: 24px;
      background: rgba(255, 255, 255, 0.94);
      box-shadow:
        0 15px 35px rgba(0, 50, 22, 0.08),
        inset 0 1px 0 rgba(255, 255, 255, 0.9);
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      overflow: hidden;
      transition:
        transform 0.3s ease,
        box-shadow 0.3s ease,
        border-color 0.3s ease;
    }

    .benefit-card::before {
      content: "";
      position: absolute;
      top: 0;
      left: 50%;
      width: 70px;
      height: 4px;
      border-radius: 0 0 8px 8px;
      background: var(--green);
      transform: translateX(-50%);
    }

    .benefit-card:hover {
      transform: translateY(-7px);
      border-color: rgba(0, 122, 54, 0.35);
      box-shadow:
        0 22px 45px rgba(0, 70, 30, 0.14),
        inset 0 1px 0 rgba(255, 255, 255, 1);
    }

    .benefit-card-content {
      position: relative;
      z-index: 1;
      width: 100%;
    }

    /* =========================
       アイコン
    ========================= */
    .benefit-icon {
      width: 58px;
      height: 58px;
      margin: 0 auto 16px;
      border-radius: 18px;
      background: rgba(0, 122, 54, 0.09);
      color: var(--green);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 29px;
      font-weight: 900;
    }

    /* =========================
       テキスト
    ========================= */
    .benefit-label {
      display: block;
      margin-bottom: 6px;
      color: #333333;
      font-size: clamp(14px, 1.1vw, 17px);
      font-weight: 800;
      letter-spacing: 0.05em;
    }

    .benefit-main {
      display: block;
      color: var(--green);
      font-size: clamp(27px, 2.5vw, 38px);
      line-height: 1.2;
      font-weight: 900;
    }

    .benefit-main.small-text {
      font-size: clamp(21px, 2vw, 30px);
    }

    .benefit-unit {
      margin-left: 3px;
      font-size: 0.55em;
      font-weight: 900;
    }

    .benefit-note {
      display: block;
      margin-top: 8px;
      color: #666666;
      font-size: 12px;
      line-height: 1.5;
    }

    /* =========================
       タブレット
    ========================= */
    @media screen and (max-width: 960px) {
      .benefits {
        padding: 45px 24px 70px;
      }

      .benefits-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }

      .benefit-card {
        min-height: 165px;
      }
    }

    /* =========================
       スマホ
    ========================= */
    @media screen and (max-width: 560px) {
      .hero-image {
        min-height: auto;
      }

      .benefits {
        padding: 35px 14px 50px;
      }

      .benefits-title-wrap {
        margin-bottom: 25px;
      }

      .benefits-subtitle {
        font-size: 11px;
      }

      .benefits-title {
        font-size: 24px;
      }

      .benefits-description {
        font-size: 13px;
        line-height: 1.7;
      }

      .benefits-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 12px;
      }

      .benefit-card {
        min-height: 145px;
        padding: 22px 8px 18px;
        border-radius: 18px;
      }

      .benefit-icon {
        width: 46px;
        height: 46px;
        margin-bottom: 12px;
        border-radius: 14px;
        font-size: 23px;
      }

      .benefit-label {
        font-size: 12px;
      }

      .benefit-main {
        font-size: 25px;
      }

      .benefit-main.small-text {
        font-size: 18px;
        line-height: 1.35;
      }

      .benefit-note {
        font-size: 10px;
      }
    }

    /* ===== Instagram ===== */

.instagram-section{
  padding:80px 20px;
  background:#f7faf8;
}

.instagram-inner{
  max-width:680px;
  margin:auto;
  text-align:center;
}

.section-en{
  color:#007a36;
  font-size:14px;
  font-weight:700;
  letter-spacing:.2em;
  margin-bottom:10px;
}

.section-title{
  font-size:48px;
  font-weight:900;
  line-height:1.3;
}

.section-title span{
  color:#007a36;
}

.instagram-text{
  margin:24px 0 40px;
  color:#555;
  line-height:1.8;
}

.instagram-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:24px;
  margin-bottom:40px;
}

.instagram-grid img{
  width:100%;
  height:220px;
  object-fit:cover;
  border-radius:18px;
}

.instagram-button{
  display:inline-block;
  padding:16px 40px;
  background:#007a36;
  color:#fff;
  border-radius:999px;
  text-decoration:none;
  font-weight:700;
}

.instagram-button:hover{
  background:#005b29;
}

@media(max-width:768px){

.section-title{
font-size:34px;
}

.instagram-grid{
grid-template-columns:1fr;
}

.instagram-grid img{
height:260px;
}

}
  </style>
</head>

<body>

  <main class="page">

    <!-- TOP画像 -->
    <section class="hero">
      <img
        class="hero-image"
        src="amecs-hero.png"
        alt="創業65年 宮崎の街の快適な生活を創造し、社会に貢献する株式会社アメックス"
      >
    </section>
<!-- Instagram・社内の雰囲気 -->
<section class="instagram-section">
  <div class="instagram-inner">

    <p class="section-en">INSTAGRAM</p>

    <h2 class="section-title">
      アメックスの<br>
      <span>社内・社員の雰囲気</span>
    </h2>

    <p class="instagram-text">
      現場の様子や社員の日常、会社の取り組みを<br>
      Instagramで発信しています。
    </p>

    <div class="instagram-grid">
      <img
        src="instagram-01.jpg"
        alt="アメックスの社内風景"
      >

      <img
        src="instagram-02.jpg"
        alt="アメックスの社員風景"
      >
    </div>

    <a
      class="instagram-button"
      href="https://www.instagram.com/"
      target="_blank"
      rel="noopener noreferrer"
    >
      Instagramを見る
    </a>

  </div>
</section>
   

  </main>

</body>
</html>
