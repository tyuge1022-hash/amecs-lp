<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>株式会社アメックス | 採用情報</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    /* スクロールバーを完全に消去し、画面内に固定 */
    html, body {
      width: 100%;
      height: 100vh;
      overflow: hidden;
      background-color: #ffffff;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    /* 画像の16:9比率を保ちながら、画面の「高さ(100vh)」にビシッと収める */
    .lp-container {
      position: relative;
      height: 100vh;
      width: calc(100vh * (1920 / 1080));
      max-width: 100vw;
      max-height: calc(100vw * (1080 / 1920));
      margin: auto;
    }

    /* 背景ベース画像 (kore1.png) */
    .bg-image {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
    }

    /* 「ご質問・ご相談」の上にジャストフィットするボタン位置 */
    .button-wrapper {
      position: absolute;
      left: 2.1%;
      bottom: 11.2%;
      width: 43.8%;
      display: flex;
      gap: 3.2%;
      align-items: center;
      z-index: 10;
    }

    .btn-link {
      flex: 1;
      display: block;
      text-decoration: none;
      transition: transform 0.15s ease, filter 0.15s ease;
    }

    .btn-link:hover {
      transform: translateY(-2px) scale(1.02);
      filter: brightness(1.05);
    }

    .btn-link:active {
      transform: translateY(1px) scale(0.98);
    }

    .btn-img {
      width: 100%;
      height: auto;
      display: block;
      pointer-events: none;
    }
  </style>
</head>
<body>

  <div class="lp-container">
    <img src="kore1.png" alt="株式会社アメックス 採用LP" class="bg-image">

    <div class="button-wrapper">
      <a href="#" class="btn-link" target="_blank" rel="noopener noreferrer">
        <img src="Lin.png" alt="LINEで会社見学予約" class="btn-img">
      </a>
      <a href="#" class="btn-link" target="_blank" rel="noopener noreferrer">
        <img src="indeed.png" alt="Indeedから応募する" class="btn-img">
      </a>
    </div>
  </div>

</body>
</html>
