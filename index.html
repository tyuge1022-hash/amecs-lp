<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>株式会社アメックス | 採用情報</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: "Helvetica Neue", Arial, "Hiragino Kaku Gothic ProN", "Hiragino Sans", Meiryo, sans-serif;
      background-color: #f8f9fa;
      color: #333;
    }

    /* ==========================================
       PC用スタイル（kore1.png）
       ========================================== */
    @media (min-width: 768px) {
      .mobile-only { display: none !important; }
      
      html, body {
        width: 100%;
        height: 100vh;
        overflow: hidden;
        display: flex;
        justify-content: center;
        align-items: center;
      }

      .pc-container {
        position: relative;
        height: 100vh;
        width: calc(100vh * (1920 / 1080));
        max-width: 100vw;
        max-height: calc(100vw * (1080 / 1920));
      }

      .pc-bg {
        width: 100%;
        height: 100%;
        object-fit: contain;
        display: block;
      }

      /* 社員募集ロゴの配置（ロゴの左上） */
      .recruitment-logo {
        position: absolute;
        top: 2.0%;
        left: 21.0%;
        width: 9.0%;
        height: auto;
        z-index: 20;
      }

      /* PC用ボタン配置：2.0%左スライド */
      .pc-btn-wrapper {
        position: absolute;
        left: 2.0%;
        bottom: 12.0%;
        width: 41.8%;
        display: flex;
        gap: 1.8%;
        align-items: center;
        justify-content: space-between;
        z-index: 10;
      }

      .btn-link {
        flex: 1;
        display: block;
        text-decoration: none;
        transition: transform 0.15s ease, filter 0.15s ease;
      }
      .btn-link:hover {
        transform: translateY(-2px) scale(1.02);
        filter: brightness(1.05);
      }
      .btn-link:active {
        transform: translateY(1px) scale(0.98);
      }
      .btn-img {
        width: 82%;
        height: auto;
        display: block;
        margin: 0 auto;
        pointer-events: none;
      }
    }

    /* ==========================================
       スマホ用スタイル（YTYTYTYTYTYTYTYT.png）
       ========================================== */
    @media (max-width: 767px) {
      .pc-only { display: none !important; }

      body {
        overflow-y: auto;
        overflow-x: hidden;
        background-color: #f8f9fa;
      }

      .sp-container {
        position: relative;
        width: 100vw;
        max-width: 100%;
        margin: 0 auto;
      }

      .sp-bg {
        width: 100%;
        height: auto;
        display: block;
      }

      /* スマホ用ボタン配置エリア */
      .sp-btn-wrapper {
        position: absolute;
        left: 3.2%;
        top: 61.5%;
        width: 93.6%;
        display: flex;
        flex-direction: column;
        gap: 8px;
        z-index: 10;
      }

      .sp-btn-link {
        width: 100%;
        display: flex;
        justify-content: center;
        align-items: center;
        text-decoration: none;
        transition: transform 0.15s ease;
      }
      .sp-btn-link:active {
        transform: scale(0.98);
      }

      /* 縦幅（高さ）を60pxにジャスト固定 */
      .sp-btn-img {
        width: auto;
        height: 60px;
        max-width: 100%;
        object-fit: contain;
        display: block;
      }
    }
  </style>
</head>
<body>

  <div class="pc-only pc-container">
    <img src="正社員登用.png" alt="正社員募集" class="recruitment-logo">
    <img src="kore1.png" alt="株式会社アメックス 採用LP" class="pc-bg">
    <div class="pc-btn-wrapper">
      <a href="#" class="btn-link" target="_blank" rel="noopener noreferrer"><img src="Lin.png" alt="LINEで会社見学予約" class="btn-img"></a>
      <a href="#" class="btn-link" target="_blank" rel="noopener noreferrer"><img src="indeed.png" alt="Indeedから応募する" class="btn-img"></a>
    </div>
  </div>

  <div class="mobile-only sp-container">
    <img src="YTYTYTYTYTYTYTYT.png" alt="株式会社アメックス 採用LP" class="sp-bg">
    <div class="sp-btn-wrapper">
      <a href="#" class="sp-btn-link" target="_blank" rel="noopener noreferrer">
        <img src="Lin.png" alt="LINEで会社見学予約" class="sp-btn-img">
      </a>
      <a href="#" class="sp-btn-link" target="_blank" rel="noopener noreferrer">
        <img src="indeed.png" alt="Indeedから応募する" class="sp-btn-img">
      </a>
    </div>
  </div>

</body>
</html>
