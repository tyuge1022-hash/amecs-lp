<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>株式会社アメックス | 採用情報</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background-color: #f8f9fa;
      color: #333;
      font-family: "Helvetica Neue", Arial, "Hiragino Kaku Gothic ProN", "Hiragino Sans", Meiryo, sans-serif;
      overflow-x: hidden;
    }

    /* LP全体のコンテナ：中央に配置し、綺麗な幅に収める */
    .lp-container {
      width: 100%;
      max-width: 800px;
      margin: 0 auto;
      background-color: #ffffff;
      display: flex;
      flex-direction: column;
    }

    /* 画像基本設定：横幅いっぱい、高さ自動調整で絶対崩さない */
    .lp-image {
      width: 100%;
      height: auto;
      display: block;
    }

    /* 各セクションの共通箱 */
    .lp-section {
      position: relative;
      width: 100%;
    }

    /* 【1段目】LINE INDEED.png のリンク設定 */
    .btn-line-link {
      position: absolute;
      top: 5%;
      left: 5%;
      width: 90%;
      height: 42%;
      z-index: 10;
      display: block;
    }
    .btn-indeed-link {
      position: absolute;
      top: 53%;
      left: 5%;
      width: 90%;
      height: 42%;
      z-index: 10;
      display: block;
    }

    /* 【3段目】社長.png の左右分割リンク設定 */
    .sns-instagram-link {
      position: absolute;
      top: 0;
      left: 0;
      width: 50%;
      height: 100%;
      z-index: 10;
      display: block;
    }
    .sns-youtube-link {
      position: absolute;
      top: 0;
      right: 0;
      width: 50%;
      height: 100%;
      z-index: 10;
      display: block;
    }
  </style>
</head>
<body>

  <div class="lp-container">

    <div class="lp-section">
      <img src="LINE INDEED.png" alt="LINE・Indeed 応募ボタン" class="lp-image">
      
      <a href="https://lin.ee/reF3WAE" class="btn-line-link" target="_blank" rel="noopener noreferrer"></a>

      <a href="#" class="btn-indeed-link" target="_blank" rel="noopener noreferrer"></a>
    </div>

    <div class="lp-section">
      <img src="TOP.png" alt="株式会社アメックス 採用情報" class="lp-image">
    </div>

    <div class="lp-section">
      <img src="社長.png" alt="Instagram & YouTube" class="lp-image">
      
      <a href="https://www.instagram.com/ameces0801?igsh=MWIyd2N6ZjdmeW85Yg%3D%3D&utm_source=qr" class="sns-instagram-link" target="_blank" rel="noopener noreferrer"></a>
      
      <a href="https://youtu.be/az3GOuyHM08" class="sns-youtube-link" target="_blank" rel="noopener noreferrer"></a>
    </div>

  </div>

</body>
</html>
