<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>株式会社アメックス | 採用情報</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background-color: #fff;
      color: #111;
      line-height: 1.4;
    }

    /* --- HERO CONTAINER (左右の要素の高さを揃える) --- */
    .hero-container {
      position: relative;
      width: 100%;
      height: 480px; /* 全体の高さを480pxに統一 */
      background-color: #ffffff;
      display: flex;
      align-items: stretch; /* 左右の要素の高さをぴったり揃える */
      overflow: hidden;
    }

    /* 左エリア：完全透過画像を指定・高さを均一化 */
    .hero-left {
      width: 50%;
      height: 100%;
      background-color: #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      z-index: 2;
    }

    .hero-left-img {
      max-height: 90%;
      max-width: 100%;
      width: auto;
      height: auto;
      object-fit: contain;
      display: block;
      /* 乗算処理は完全に解除 */
    }

    /* 右エリア：男性二人の写真（高さを左側と完全統一） */
    .hero-right {
      width: 50%;
      height: 100%;
      background-image: url('https://s3-ap-northeast-1.amazonaws.com/s3.peraichi.com/userData/5b8ae463-b598-40b0-af68-03e50a0000fe/img/80277585-2525-41db-818f-8b6ac43b37be/7BD93500-5E22-4A97-BD2F-6C36B132458F.jpg');
      background-size: cover;
      background-position: center center;
      background-repeat: no-repeat;
      position: relative;
      z-index: 1;
    }

    /* 右上：CVボタン群 */
    .header-buttons {
      position: absolute;
      top: 20px;
      right: 30px;
      z-index: 10;
      display: flex;
      gap: 12px;
      align-items: center;
    }

    /* LINEボタン */
    .btn-line {
      background: linear-gradient(180deg, #28d128 0%, #009900 100%);
      color: #fff;
      padding: 8px 22px;
      border-radius: 40px;
      font-weight: 700;
      font-size: 0.85rem;
      text-decoration: none;
      display: inline-flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 10px rgba(0, 150, 0, 0.3);
      border: 1px solid rgba(255, 255, 255, 0.4);
      transition: transform 0.2s;
    }

    .btn-line .sub-text {
      font-size: 0.68rem;
      font-weight: 500;
      opacity: 0.95;
      margin-bottom: 2px;
    }

    .btn-line .main-text {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 0.95rem;
      font-weight: 800;
    }

    /* Indeedボタン */
    .btn-indeed {
      background: linear-gradient(180deg, #1877f2 0%, #0056b3 100%);
      color: #fff;
      padding: 12px 24px;
      border-radius: 40px;
      font-weight: 800;
      font-size: 0.92rem;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      box-shadow: 0 4px 10px rgba(0, 86, 179, 0.3);
      border: 1px solid rgba(255, 255, 255, 0.4);
      transition: transform 0.2s;
    }

    .btn-line:hover, .btn-indeed:hover {
      transform: translateY(-2px);
    }

    /* スマホ対応 */
    @media (max-width: 960px) {
      .hero-container {
        flex-direction: column;
        height: auto;
      }
      .hero-left, .hero-right {
        width: 100%;
      }
      .hero-left {
        padding: 80px 20px 30px;
      }
      .hero-right {
        height: 300px;
      }
      .header-buttons {
        top: 12px;
        right: 12px;
      }
    }
  </style>
</head>
<body>

  <div class="hero-container">

    <div class="header-buttons">
      <a href="#" class="btn-line">
        <span class="sub-text">求人に関するご質問・ご応募はこちら</span>
        <span class="main-text">💬 LINEで相談する</span>
      </a>
      <a href="#" class="btn-indeed">
        Indeedで応募する &rsaquo;
      </a>
    </div>

    <div class="hero-left
