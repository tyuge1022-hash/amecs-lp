<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>株式会社アメックス | 採用情報</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background-color: #fff;
      color: #111;
      line-height: 1.4;
    }

    /* --- HERO MAIN CONTAINER --- */
    .hero-container {
      position: relative;
      width: 100%;
      min-height: 560px;
      background-image: url('https://s3-ap-northeast-1.amazonaws.com/s3.peraichi.com/userData/5b8ae463-b598-40b0-af68-03e50a0000fe/img/80277585-2525-41db-818f-8b6ac43b37be/7BD93500-5E22-4A97-BD2F-6C36B132458F.jpg');
      background-size: cover;
      background-position: center right;
      overflow: hidden;
    }

    /* 背景写真と左側画像をスムーズに馴染ませる自然な白グラデーション */
    .hero-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: linear-gradient(
        90deg, 
        rgba(255,255,255,1) 0%, 
        rgba(255,255,255,0.98) 35%, 
        rgba(255,255,255,0.2) 52%, 
        rgba(255,255,255,0) 70%
      );
      z-index: 1;
    }

    /* コンテンツ配置レイヤー */
    .hero-content {
      position: relative;
      z-index: 2;
      max-width: 1320px;
      margin: 0 auto;
      padding: 20px 30px;
      min-height: 560px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    /* --- HEADER (LINE / INDEED ボタン群) --- */
    .header-area {
      display: flex;
      justify-content: flex-end;
      align-items: center;
      width: 100%;
      padding-top: 5px;
    }

    .btn-group {
      display: flex;
      gap: 16px;
    }

    /* 大型＆スタイリッシュなCVボタン */
    .btn-line {
      background-color: #00b900;
      color: #fff;
      padding: 13px 32px;
      border-radius: 35px;
      font-weight: 800;
      font-size: 1.05rem;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      box-shadow: 0 4px 14px rgba(0, 185, 0, 0.35);
      transition: all 0.2s ease;
    }

    .btn-indeed {
      background-color: #0056b3;
      color: #fff;
      padding: 13px 36px;
      border-radius: 35px;
      font-weight: 800;
      font-size: 1.05rem;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      box-shadow: 0 4px 14px rgba(0, 86, 179, 0.35);
      transition: all 0.2s ease;
    }

    .btn-line:hover, .btn-indeed:hover {
      transform: translateY(-2px);
    }

    /* --- HERO BODY --- */
    .hero-main {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      width: 100%;
      margin-bottom: 15px;
    }

    /* 左側画像（ロゴ＋創業65年＋キャッチコピー一体化画像） */
    .left-img-box {
      width: 520px;
      max-width: 48%;
    }

    .left-img {
      width: 100%;
      height: auto;
      display: block;
    }

    /* 右下画像（年間休日4つのカード一体化画像） */
    .right-cards-box {
      width: 440px;
      max-width: 42%;
      margin-bottom: 10px;
    }

    .right-cards-img {
      width: 100%;
      height: auto;
      display: block;
      filter: drop-shadow(0 6px 18px rgba(0,0,0,0.12));
    }

    /* レスポンシブ対応 */
    @media (max-width: 960px) {
      .hero-overlay {
        background: linear-gradient(180deg, rgba(255,255,255,0.95) 0%, rgba(255,255,255,0.85) 60%, rgba(255,255,255,0.2) 100%);
      }
      .header-area {
        justify-content: center;
      }
      .hero-main {
        flex-direction: column;
        align-items: flex-start;
        gap: 20px;
      }
      .left-img-box, .right-cards-box {
        width: 100%;
        max-width: 100%;
      }
    }
  </style>
</head>
<body>

  <div class="hero-container">
    <div class="hero-overlay"></div>
    <div class="hero-content">
      
      <header class="header-area">
        <div class="btn-group">
          <a href="#" class="btn-line">LINEで相談する</a>
          <a href="#" class="btn-indeed">Indeedで応募する &rarr;</a>
        </div>
      </header>

      <div class="hero-main">
        
        <div class="left-img-box">
          <img class="left-img" src="https://s3-ap-northeast-1.amazonaws.com/s3.peraichi.com/userData/5b8ae463-b598-40b0-af68-03e50a0000fe/img/8ae1a8ff-613b-4f6c-a724-ba9d7aeb3e94/65nenn_kai_.png" alt="AMECS 創業65年 宮崎の街の快適な生活を創造し、社会に貢献する。">
        </div>

        <div class="right-cards-box">
          <img class="right-cards-img" src="https://s3-ap-northeast-1.amazonaws.com/s3.peraichi.com/userData/5b8ae463-b598-40b0-af68-03e50a0000fe/img/466d96b8-fc2e-42b6-af4f-eb895402bb2c/nennkann_.png" alt="年間休日123日 完全週休2日制 未経験歓迎 資格取得支援">
        </div>

      </div>

    </div>
  </div>

</body>
</html>
