<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>株式会社アメックス | 採用情報</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background-color: #fff;
      color: #111;
      line-height: 1.4;
    }

    /* --- メインコンテナ（背景画像：人二人） --- */
    .hero-container {
      position: relative;
      width: 100%;
      min-height: 560px;
      /* ↓ ここに人二人の背景画像を指定 ↓ */
      background-image: url('https://s3-ap-northeast-1.amazonaws.com/s3.peraichi.com/userData/5b8ae463-b598-40b0-af68-03e50a0000fe/img/80277585-2525-41db-818f-8b6ac43b37be/7BD93500-5E22-4A97-BD2F-6C36B132458F.jpg');
      background-size: cover;
      background-position: center right;
      overflow: hidden;
    }

    /* 自然な白グラデーション（左側の文字をくっきり見せる） */
    .hero-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: linear-gradient(
        90deg, 
        rgba(255,255,255,1) 0%, 
        rgba(255,255,255,0.98) 35%, 
        rgba(255,255,255,0.2) 52%, 
        rgba(255,255,255,0) 70%
      );
      z-index: 1;
    }

    /* レイアウト構造 */
    .hero-content {
      position: relative;
      z-index: 2;
      max-width: 1320px;
      margin: 0 auto;
      padding: 24px 30px;
      min-height: 560px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    /* --- HEADER (ロゴ ＆ CVボタン) --- */
    .header-area {
      display: flex;
      justify-content: space-between;
      align-items: center;
      width: 100%;
    }

    /* 左上ロゴ画像：歪み防止・透過 */
    .logo-img {
      height: 60px; /* ロゴサイズを大きく調整 */
      width: auto;
      object-fit: contain;
      mix-blend-mode: multiply; /* 白地に馴染ませる */
      display: block;
    }

    /* CVボタン群 */
    .btn-group {
      display: flex;
      gap: 16px;
    }

    .btn-line {
      background-color: #00b900;
      color: #fff;
      padding: 13px 32px;
      border-radius: 35px;
      font-weight: 800;
      font-size: 1.05rem;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      box-shadow: 0 4px 14px rgba(0, 185, 0, 0.35);
    }

    .btn-indeed {
      background-color: #0056b3;
      color: #fff;
      padding: 13px 36px;
      border-radius: 35px;
      font-weight: 800;
      font-size: 1.05rem;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      box-shadow: 0 4px 14px rgba(0, 86, 179, 0.35);
    }

    /* --- HERO BODY --- */
    .hero-main {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      width: 100%;
      margin-top: 15px;
      margin-bottom: 10px;
    }

    /* 左側テキスト群（ロゴの直下に配置） */
    .catch-box {
      max-width: 580px;
    }

    .badge-wrap {
      font-size: 1.5rem;
      font-weight: 900;
      color: #00873c;
      margin-bottom: 8px;
    }

    .badge-wrap span {
      font-size: 2.3rem;
      font-weight: 900;
    }

    .title-main {
      font-size: 3.1rem;
      font-weight: 900;
      line-height: 1.25;
      color: #111;
      margin-bottom: 18px;
      letter-spacing: -0.02em;
    }

    .title-main .green {
      color: #00873c;
    }

    .desc-text {
      font-size: 1.2rem;
      color: #111;
      line-height: 1.6;
      font-weight: 800;
    }

    /* 右下カード画像：ご指定のnennkann_.png */
    .cards-img-box {
      width: 440px;
      max-width: 45%;
      margin-bottom: 10px;
    }

    .cards-img {
      width: 100%;
      height: auto;
      display: block;
      filter: drop-shadow(0 6px 18px rgba(0,0,0,0.12));
    }

    /* モバイル対応 */
    @media (max-width: 960px) {
      .header-area {
        flex-direction: column;
        align-items: flex-start;
        gap: 20px;
      }
      .hero-main {
        flex-direction: column;
        align-items: flex-start;
        gap: 30px;
      }
      .cards-img-box {
        width: 100%;
        max-width: 100%;
      }
      .title-main {
        font-size: 2.2rem;
      }
    }
  </style>
</head>
<body>

  <div class="hero-container">
    <div class="hero-overlay"></div>
    <div class="hero-content">
      
      <header class="header-area">
        <img class="logo-img" src="https://s3-ap-northeast-1.amazonaws.com/s3.peraichi.com/userData/5b8ae463-b598-40b0-af68-03e50a0000fe/img/69d2337e-f65d-42f5-a37c-a2e630f9da90/__.jpg" alt="AMECS LOGO">
        
        <div class="btn-group">
          <a href="#" class="btn-line">LINEで相談する</a>
          <a href="#" class="btn-indeed">Indeedで応募する &rarr;</a>
        </div>
      </header>

      <div class="hero-main">
        
        <div class="catch-box">
          <div class="badge-wrap">創業 <span>65</span> 年</div>
          <h1 class="title-main">
            宮崎の快適な<br>
            <span class="green">生活</span>を<span class="green">創造</span>し、<br>
            <span class="green">社会</span>に<span class="green">貢献</span>する。
          </h1>
          <p class="desc-text">
            公共施設から一般住宅まで。<br>
            地域のライフラインを支え続ける総合設備会社です。
          </p>
        </div>

        <div class="cards-img-box">
          <img class="cards-img" src="https://s3-ap-northeast-1.amazonaws.com/s3.peraichi.com/userData/5b8ae463-b598-40b0-af68-03e50a0000fe/img/466d96b8-fc2e-42b6-af4f-eb895402bb2c/nennkann_.png" alt="年間休日123日 完全週休2日制 未経験歓迎 資格取得支援">
        </div>

      </div>

    </div>
  </div>

</body>
</html>
