<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>株式会社アメックス | 採用情報</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background-color: #fff;
      color: #111;
      line-height: 1.4;
    }

    /* メインコンテナ（背景画像配置） */
    .hero-container {
      position: relative;
      width: 100%;
      min-height: 520px;
      background-image: url('https://s3-ap-northeast-1.amazonaws.com/s3.peraichi.com/userData/5b8ae463-b598-40b0-af68-03e50a0000fe/img/80277585-2525-41db-818f-8b6ac43b37be/7BD93500-5E22-4A97-BD2F-6C36B132458F.jpg');
      background-size: cover;
      background-position: center right;
      overflow: hidden;
    }

    /* 自然な白グラデーション（左側を白くして文字をくっきり見せる） */
    .hero-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: linear-gradient(
        90deg, 
        rgba(255,255,255,1) 0%, 
        rgba(255,255,255,0.95) 35%, 
        rgba(255,255,255,0.2) 55%, 
        rgba(255,255,255,0) 75%
      );
      z-index: 1;
    }

    /* レイアウト構造 */
    .hero-content {
      position: relative;
      z-index: 2;
      max-width: 1280px;
      margin: 0 auto;
      padding: 20px 30px;
      min-height: 520px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    /* --- HEADER (ロゴ ＆ CVボタン) --- */
    .header-area {
      display: flex;
      justify-content: space-between;
      align-items: center;
      width: 100%;
    }

    /* 潰れ・変形を完全に防止したロゴ */
    .logo-img {
      height: 48px;
      width: auto;
      object-fit: contain;
      display: block;
    }

    .btn-group {
      display: flex;
      gap: 12px;
    }

    .btn-line {
      background-color: #00b900;
      color: #fff;
      padding: 10px 24px;
      border-radius: 30px;
      font-weight: 800;
      font-size: 0.95rem;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      box-shadow: 0 4px 10px rgba(0, 185, 0, 0.25);
    }

    .btn-indeed {
      background-color: #0056b3;
      color: #fff;
      padding: 10px 28px;
      border-radius: 30px;
      font-weight: 800;
      font-size: 0.95rem;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      box-shadow: 0 4px 10px rgba(0, 86, 179, 0.25);
    }

    /* --- MAIN AREA --- */
    .hero-main {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      width: 100%;
      margin-top: 10px;
      margin-bottom: 10px;
    }

    /* 左側テキスト群 */
    .catch-box {
      max-width: 520px;
    }

    .badge-wrap {
      font-size: 1.25rem;
      font-weight: 800;
      color: #00873c;
      margin-bottom: 6px;
    }

    .badge-wrap span {
      font-size: 1.9rem;
      font-weight: 900;
    }

    .title-main {
      font-size: 2.7rem;
      font-weight: 900;
      line-height: 1.25;
      color: #111;
      margin-bottom: 14px;
      letter-spacing: -0.02em;
    }

    .title-main .green {
      color: #00873c;
    }

    .desc-text {
      font-size: 1.05rem;
      color: #222;
      line-height: 1.5;
      font-weight: 700;
    }

    /* 右下カード画像 */
    .cards-img-box {
      width: 400px;
      max-width: 42%;
      margin-bottom: 5px;
    }

    .cards-img {
      width: 100%;
      height: auto;
      display: block;
      filter: drop-shadow(0 4px 12px rgba(0,0,0,0.15));
    }

    /* モバイル対応 */
    @media (max-width: 860px) {
      .header-area {
        flex-direction: column;
        align-items: flex-start;
        gap: 15px;
      }
      .hero-main {
        flex-direction: column;
        align-items: flex-start;
        gap: 20px;
      }
      .cards-img-box {
        width: 100%;
        max-width: 100%;
      }
      .title-main {
        font-size: 2.0rem;
      }
    }
  </style>
</head>
<body>

  <div class="hero-container">
    <div class="hero-overlay"></div>
    <div class="hero-content">
      
      <header class="header-area">
        <img class="logo-img" src="https://s3-ap-northeast-1.amazonaws.com/s3.peraichi.com/userData/5b8ae463-b598-40b0-af68-03e50a0000fe/img/69d2337e-f65d-42f5-a37c-a2e630f9da90/__.jpg" alt="AMECS">
        <div class="btn-group">
          <a href="#" class="btn-line">LINEで相談する</a>
          <a href="#" class="btn-indeed">Indeedで応募する &rarr;</a>
        </div>
      </header>

      <div class="hero-main">
        
        <div class="catch-box">
          <div class="badge-wrap">創業 <span>65</span> 年</div>
          <h1 class="title-main">
            宮崎の街の快適な<br>
            <span class="green">生活</span>を<span class="green">創造</span>し、<br>
            <span class="green">社会</span>に<span class="green">貢献</span>する。
          </h1>
          <p class="desc-text">
            公共施設から一般住宅まで。<br>
            地域のライフラインを支え続ける総合設備会社です。
          </p>
        </div>

        <div class="cards-img-box">
          <img class="cards-img" src="https://s3-ap-northeast-1.amazonaws.com/s3.peraichi.com/userData/5b8ae463-b598-40b0-af68-03e50a0000fe/img/466d96b8-fc2e-42b6-af4f-eb895402bb2c/nennkann_.png" alt="年間休日123日 完全週休2日制 未経験歓迎 資格取得支援">
        </div>

      </div>

    </div>
  </div>

</body>
</html>
