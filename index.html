<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>株式会社アメックス | 採用LP</title>
  <style>
    /* 全体リセット */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: 'Hiragino Kaku Gothic ProN', 'メイリオ', sans-serif;
      color: #333;
      background-color: #f8fafc;
      line-height: 1.6;
    }

    /* --- HEROエリア --- */
    .hero-container {
      position: relative;
      width: 100%;
      min-height: 560px;
      background-image: url('https://s3-ap-northeast-1.amazonaws.com/s3.peraichi.com/userData/5b8ae463-b598-40b0-af68-03e50a0000fe/img/80277585-2525-41db-818f-8b6ac43b37be/7BD93500-5E22-4A97-BD2F-6C36B132458F.jpg');
      background-size: cover;
      background-position: center center;
      overflow: hidden;
    }

    /* 左側の白フェードグラデーション */
    .hero-fade {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: linear-gradient(
        to right,
        #ffffff 0%,
        rgba(255, 255, 255, 0.98) 28%,
        rgba(255, 255, 255, 0.82) 42%,
        rgba(255, 255, 255, 0) 62%
      );
      z-index: 1;
    }

    .hero-inner {
      position: relative;
      z-index: 2;
      max-width: 1200px;
      margin: 0 auto;
      padding: 24px 30px;
      min-height: 560px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    /* ヘッダー */
    .top-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      width: 100%;
    }

    .logo-img {
      height: 48px;
      width: auto;
      display: block;
    }

    .header-btns {
      display: flex;
      gap: 12px;
    }

    .btn-green {
      background-color: #00873c;
      color: #fff;
      padding: 10px 22px;
      border-radius: 30px;
      font-weight: bold;
      font-size: 0.88rem;
      text-decoration: none;
      box-shadow: 0 4px 10px rgba(0,0,0,0.12);
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }

    .btn-blue {
      background-color: #0056b3;
      color: #fff;
      padding: 10px 24px;
      border-radius: 30px;
      font-weight: bold;
      font-size: 0.9rem;
      text-decoration: none;
      box-shadow: 0 4px 10px rgba(0,0,0,0.12);
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }

    /* メインボディ（完全上寄せ配置） */
    .hero-body {
      display: flex;
      justify-content: space-between;
      align-items: flex-start; /* 左テキストを上寄せ */
      width: 100%;
      margin-top: 10px;
    }

    /* 左側キャッチコピー（上寄せ） */
    .catch-area {
      max-width: 520px;
    }

    .badge-years {
      font-size: 1.15rem;
      font-weight: 800;
      color: #00873c;
      margin-bottom: 4px;
    }
    .badge-years span {
      font-size: 1.9rem;
      font-weight: 900;
    }

    .main-copy {
      font-size: 2.7rem;
      font-weight: 900;
      line-height: 1.22;
      color: #111;
      margin: 0 0 16px 0;
      letter-spacing: -0.02em;
    }
    .main-copy .highlight {
      color: #00873c;
    }

    .sub-copy {
      font-size: 0.92rem;
      color: #333;
      line-height: 1.65;
      font-weight: 600;
    }

    /* 右側 4つのカード（写真の上・右下寄り配置） */
    .cards-area {
      align-self: flex-end; /* カード群だけ下寄せ */
      margin-bottom: 10px;
    }

    .cards-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      width: 330px;
    }

    .card-item {
      background: rgba(255, 255, 255, 0.96);
      border-radius: 12px;
      padding: 12px 14px;
      display: flex;
      align-items: center;
      gap: 10px;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.08);
    }

    .card-icon {
      font-size: 1.4rem;
      flex-shrink: 0;
    }

    .card-label {
      font-size: 0.75rem;
      font-weight: bold;
      color: #333;
      line-height: 1.2;
    }
    .card-label span {
      display: block;
      font-size: 1.15rem;
      color: #00873c;
      font-weight: 900;
    }

    /* レスポンシブ対応 */
    @media (max-width: 860px) {
      .top-header {
        flex-direction: column;
        align-items: flex-start;
        gap: 12px;
      }
      .hero-body {
        flex-direction: column;
        gap: 24px;
      }
      .cards-area {
        align-self: flex-start;
        width: 100%;
      }
      .cards-grid {
        width: 100%;
      }
      .main-copy {
        font-size: 2rem;
      }
      .hero-fade {
        background: linear-gradient(to bottom, #ffffff 0%, rgba(255,255,255,0.92) 70%, rgba(255,255,255,0.4) 100%);
      }
    }
  </style>
</head>
<body>

  <div class="hero-container">
    <div class="hero-fade"></div>
    <div class="hero-inner">
      
      <header class="top-header">
        <img class="logo-img" src="https://s3-ap-northeast-1.amazonaws.com/s3.peraichi.com/userData/5b8ae463-b598-40b0-af68-03e50a0000fe/img/69d2337e-f65d-42f5-a37c-a2e630f9da90/__.jpg" alt="AMECS">
        <div class="header-btns">
          <a href="#" class="btn-green">💬 LINEで相談する</a>
          <a href="#" class="btn-blue">Indeedで応募する &rarr;</a>
        </div>
      </header>

      <div class="hero-body">
        
        <div class="catch-area">
          <div class="badge-years">創業 <span>65</span> 年</div>
          <h1 class="main-copy">
            宮崎の街の快適な<br>
            <span class="highlight">生活</span>を<span class="highlight">創造</span>し、<br>
            <span class="highlight">社会</span>に<span class="highlight">貢献</span>する。
          </h1>
          <p class="sub-copy">
            公共施設から一般住宅まで。<br>
            地域のライフラインを支え続ける<br>
            総合設備会社です。
          </p>
        </div>

        <div class="cards-area">
          <div class="cards-grid">
            <div class="card-item">
              <div class="card-icon">📅</div>
              <div class="card-label">年間休日<span>123日</span></div>
            </div>
            <div class="card-item">
              <div class="card-icon">🔄</div>
              <div class="card-label">完全週休<span>2日制</span></div>
            </div>
            <div class="card-item">
              <div class="card-icon">🌱</div>
              <div class="card-label">未経験歓迎</div>
            </div>
            <div class="card-item">
              <div class="card-icon">🏅</div>
              <div class="card-label">資格取得支援</div>
            </div>
          </div>
        </div>

      </div>

    </div>
  </div>

</body>
</html>
