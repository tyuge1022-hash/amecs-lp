<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>株式会社アメックス | 採用情報</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background-color: #fff;
      color: #111;
      line-height: 1.4;
    }

    /* --- メインコンテナ（左右分離 ＆ ゆったり高さ600px） --- */
    .hero-container {
      width: 100%;
      height: 600px; /* ゆったりとした高さ設定 */
      display: flex;
      background-color: #fff;
      overflow: hidden;
      position: relative;
    }

    /* --- 左側：文字エリア（純白） --- */
    .hero-left {
      width: 48%;
      height: 100%;
      background-color: #ffffff;
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: 40px 0 40px 50px;
      z-index: 2;
    }

    .badge-wrap {
      font-size: 1.35rem;
      font-weight: 900;
      color: #00873c;
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .badge-wrap span {
      font-size: 2.2rem;
      font-weight: 900;
      line-height: 1;
    }

    .title-main {
      font-size: 3.0rem;
      font-weight: 900;
      line-height: 1.25;
      color: #111;
      margin-bottom: 20px;
      letter-spacing: -0.02em;
    }

    .title-main .green {
      color: #00873c;
    }

    .desc-text {
      font-size: 1.15rem;
      color: #333;
      line-height: 1.6;
      font-weight: 700;
    }

    /* --- 右側：写真エリア（グラデーションなし・高画質） --- */
    .hero-right {
      width: 52%;
      height: 100%;
      position: relative;
      background-image: url('https://s3-ap-northeast-1.amazonaws.com/s3.peraichi.com/userData/5b8ae463-b598-40b0-af68-03e50a0000fe/img/80277585-2525-41db-818f-8b6ac43b37be/7BD93500-5E22-4A97-BD2F-6C36B132458F.jpg');
      background-size: cover;
      background-position: center center;
      background-repeat: no-repeat;
    }

    /* --- 右上：CVボタン群 --- */
    .header-buttons {
      position: absolute;
      top: 24px;
      right: 40px;
      z-index: 10;
      display: flex;
      gap: 14px;
    }

    .btn-line {
      background-color: #00b900;
      color: #fff;
      padding: 12px 28px;
      border-radius: 35px;
      font-weight: 800;
      font-size: 1.0rem;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      box-shadow: 0 4px 12px rgba(0, 185, 0, 0.3);
      transition: transform 0.2s;
    }

    .btn-indeed {
      background-color: #0056b3;
      color: #fff;
      padding: 12px 30px;
      border-radius: 35px;
      font-weight: 800;
      font-size: 1.0rem;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      box-shadow: 0 4px 12px rgba(0, 86, 179, 0.3);
      transition: transform 0.2s;
    }

    .btn-line:hover, .btn-indeed:hover {
      transform: translateY(-2px);
    }

    /* --- 右下：年間休日カード画像 --- */
    .cards-img-box {
      position: absolute;
      bottom: 24px;
      right: 30px;
      width: 420px;
      max-width: 85%;
      z-index: 5;
    }

    .cards-img {
      width: 100%;
      height: auto;
      display: block;
      filter: drop-shadow(0 6px 16px rgba(0,0,0,0.25));
    }

    /* --- モバイル対応（スマホ画面では縦並び） --- */
    @media (max-width: 960px) {
      .hero-container {
        flex-direction: column;
        height: auto;
      }
      .hero-left {
        width: 100%;
        padding: 80px 24px 30px;
      }
      .hero-right {
        width: 100%;
        height: 380px;
      }
      .header-buttons {
        top: 16px;
        right: 16px;
      }
      .title-main {
        font-size: 2.2rem;
      }
      .cards-img-box {
        bottom: 16px;
        right: 16px;
        width: 320px;
      }
    }
  </style>
</head>
<body>

  <div class="hero-container">
    
    <div class="header-buttons">
      <a href="#" class="btn-line">LINEで相談する</a>
      <a href="#" class="btn-indeed">Indeedで応募する &rarr;</a>
    </div>

    <div class="hero-left">
      <div class="badge-wrap">創業 <span>65</span> 年</div>
      <h1 class="title-main">
        宮崎の街の快適な<br>
        <span class="green">生活</span>を<span class="green">創造</span>し、<br>
        <span class="green">社会</span>に<span class="green">貢献</span>する。
      </h1>
      <p class="desc-text">
        公共施設から一般住宅まで。<br>
        地域のライフラインを支え続ける総合設備会社です。
      </p>
    </div>

    <div class="hero-right">
      <div class="cards-img-box">
        <img class="cards-img" src="https://s3-ap-northeast-1.amazonaws.com/s3.peraichi.com/userData/5b8ae463-b598-40b0-af68-03e50a0000fe/img/466d96b8-fc2e-42b6-af4f-eb895402bb2c/nennkann_.png" alt="年間休日123日 完全週休2日制 未経験歓迎 資格取得支援">
      </div>
    </div>

  </div>

</body>
</html>
