<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>株式会社アメックス | 採用情報</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background-color: #fff;
      color: #111;
      line-height: 1.4;
    }

    /* --- HERO CONTAINER (高さを絞って全体を最適化) --- */
    .hero-container {
      position: relative;
      width: 100%;
      height: 480px; /* 男性画像が小さくなった分、高さをすっきりスリムに調整 */
      background-color: #fff;
      background-image: url('https://raw.githubusercontent.com/tyuge1022-hash/amecs-lp/e552bea89289769fba5a719d2686dab6d57e1f8a/7BD93500-5E22-4A97-BD2F-6C36B132458F.jpg');
      background-size: contain; 
      background-position: right center;
      background-repeat: no-repeat;
      overflow: hidden;
    }

    /* 全体レイアウト */
    .hero-content {
      position: relative;
      z-index: 2;
      max-width: 1400px;
      height: 100%;
      margin: 0 auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 30px;
    }

    /* 左側：PAFECT TOP.png（横並び配置） */
    .hero-left-img {
      height: 90%;
      width: auto;
      max-width: 58%;
      object-fit: contain;
      object-position: left center;
      display: block;
    }

    /* 右上：CVボタン群（LINE/Indeed帯デザイン） */
    .header-buttons {
      position: absolute;
      top: 20px;
      right: 30px;
      z-index: 10;
      display: flex;
      gap: 12px;
      align-items: center;
    }

    /* LINEボタン（緑グラデーション・不透明感あり） */
    .btn-line {
      background: linear-gradient(180deg, rgba(50, 205, 50, 0.92) 0%, rgba(0, 160, 0, 0.95) 100%);
      color: #fff;
      padding: 8px 22px;
      border-radius: 40px;
      font-weight: 700;
      font-size: 0.85rem;
      text-decoration: none;
      display: inline-flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 10px rgba(0, 150, 0, 0.3);
      backdrop-filter: blur(4px);
      border: 1px solid rgba(255, 255, 255, 0.3);
      transition: transform 0.2s, box-shadow 0.2s;
    }

    .btn-line .sub-text {
      font-size: 0.68rem;
      font-weight: 500;
      opacity: 0.95;
      margin-bottom: 2px;
    }

    .btn-line .main-text {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 0.95rem;
      font-weight: 800;
    }

    /* Indeedボタン */
    .btn-indeed {
      background: linear-gradient(180deg, rgba(24, 119, 242, 0.92) 0%, rgba(0, 86, 179, 0.95) 100%);
      color: #fff;
      padding: 12px 24px;
      border-radius: 40px;
      font-weight: 800;
      font-size: 0.92rem;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      box-shadow: 0 4px 10px rgba(0, 86, 179, 0.3);
      backdrop-filter: blur(4px);
      border: 1px solid rgba(255, 255, 255, 0.3);
      transition: transform 0.2s, box-shadow 0.2s;
    }

    .btn-line:hover, .btn-indeed:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 14px rgba(0, 0, 0, 0.25);
    }

    /* スマホ対応（レスポンシブ） */
    @media (max-width: 960px) {
      .hero-container {
        height: auto;
        min-height: 450px;
        background-size: cover;
      }
      .hero-content {
        flex-direction: column;
        justify-content: center;
        padding: 70px 15px 20px;
      }
      .hero-left-img {
        max-width: 100%;
        height: auto;
      }
      .header-buttons {
        top: 12px;
        right: 12px;
      }
    }
  </style>
</head>
<body>

  <div class="hero-container">

    <div class="header-buttons">
      <a href="#" class="btn-line">
        <span class="sub-text">求人に関するご質問・ご応募はこちら</span>
        <span class="main-text">💬 LINEで相談する</span>
      </a>
      <a href="#" class="btn-indeed">
        Indeedで応募する &rsaquo;
      </a>
    </div>

    <div class="hero-content">
      <img class="hero-left-img" src="https://raw.githubusercontent.com/tyuge1022-hash/amecs-lp/d24b1ad864f9be497345479558f1a4565329f65d/PAFECT%20TOP.png" alt="株式会社アメックス 創業65年 宮崎の街の快適な生活を創造し、社会に貢献する。">
    </div>

  </div>

</body>
</html>
